version: 2
project_name: agentctl

builds:
  - id: agentctl
    main: ./cmd/agentctl
    binary: agentctl
    env:
      - CGO_ENABLED=0
    goos: [darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/mnbf9rca/agentctl/internal/buildinfo.Stamp={{.Tag}}

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - LICENSES/README.md
      - LICENSES/github.com/santhosh-tekuri/jsonschema/v6/LICENSE
      - LICENSES/golang.org/x/text/LICENSE
      - LICENSES/golang.org/x/text/PATENTS

checksum:
  name_template: "checksums.txt"

release:
  draft: true
  replace_existing_artifacts: true
  mode: keep-existing

changelog:
  use: github
  sort: asc

notarize:
  macos:
    - enabled: true
      ids: [agentctl]
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: false
