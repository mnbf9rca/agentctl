name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...

  integration:
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: Install and pin tmux
        run: |
          brew install tmux
          brew pin tmux
      - name: Verify tmux version
        run: |
          actual="$(tmux -V)"
          if [[ "$actual" != "tmux 3.7b" ]]; then
            echo "tmux is $actual; the canonical argv table and input spike were verified against tmux 3.7b."
            echo "Re-run hack/probe-*.sh and hack/verify-injection.sh before changing this pin."
            exit 1
          fi
      - name: Run integration tests
        run: go test -tags integration ./...
      - name: Install goreleaser
        run: brew install goreleaser
      - name: Validate goreleaser config
        run: goreleaser check
      - name: Snapshot release build
        run: goreleaser release --snapshot --clean --skip=notarize
      - name: Smoke-test snapshot binary
        run: |
          out="$(./dist/agentctl_darwin_arm64*/agentctl version)"
          echo "snapshot binary reports: $out"
          test -n "$out"
