name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...

  integration:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: Install and pin tmux
        run: |
          brew install tmux
          brew pin tmux
      - name: Verify tmux version
        run: test "$(tmux -V)" = "tmux 3.7b"
      - name: Run integration tests
        run: go test -tags integration ./...
