name: Promotion PR form check

# Runs only on pull requests targeting `release` (issue #93). The
# `branches: [release]` filter means this workflow never even triggers for
# PRs targeting `main` — zero noise on normal development (AC5).
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [release]

permissions:
  contents: read

concurrency:
  group: promotion-form-check-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  promotion-form:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # hack/next-version.sh needs full tag history to compute the next
          # version.
          fetch-depth: 0
      - name: Write PR body to file
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$(./hack/next-version.sh)"
            printf '%s\r\n' \
              '- [ ] **Checklist run.**' \
              '- [x] **Checklist not required.**' \
              '' \
              "Version: $version" > "$RUNNER_TEMP/pr-body.md"
          else
            printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          fi
      - name: Check promotion PR form
        run: ./hack/check-promotion-form.sh "$RUNNER_TEMP/pr-body.md"
